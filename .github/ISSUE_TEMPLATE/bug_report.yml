name: Bug report
description: train.py / prepare.py / runtime.py crashes, hangs, or produces wrong output
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please do not use this form for security issues — see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. uv run prepare.py
        2. uv run train.py
        3. ...
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - NVIDIA GPU (Linux)
        - NVIDIA GPU (Windows)
        - Apple Silicon (MPS)
        - CPU
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, GPU model and VRAM, Python, torch, and (on Windows) triton-windows versions.
      placeholder: "Windows 11, RTX 4060 Laptop 8GB, Python 3.12, torch 2.6.0+cu124"
    validations:
      required: true
  - type: input
    id: backend
    attributes:
      label: Attention backend shown at startup
      placeholder: "flex-attention"
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: The last ~50 lines of run.log (tail -n 50 run.log), including any traceback.
      render: shell
