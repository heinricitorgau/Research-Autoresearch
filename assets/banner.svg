  <text x="660" y="132.9" font-family="'Chivo', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#0f0415">val_bpb</text>
  <text x="1204" y="132.9" text-anchor="end" font-family="'Chivo', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="900" fill="#0f0415">2.007002</text>
  <text x="660" y="163.1" font-family="'Chivo', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#f2ecf5">training_seconds</text>
  <text x="1204" y="163.1" text-anchor="end" font-family="'Chivo', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="900" fill="#f2ecf5">300.1</text>
  <line x1="660" y1="173.4" x2="1210" y2="173.4" stroke="#41304b" stroke-width="1"/>
