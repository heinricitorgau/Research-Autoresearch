      <rect width="1" height="3" fill="#f92434" fill-opacity="0.07"/>
      <rect x="1" width="1" height="3" fill="#4ee11b" fill-opacity="0.07"/>
      <rect x="2" width="1" height="3" fill="#376eff" fill-opacity="0.07"/>
      <rect y="2" width="3" height="1" fill="#030104" fill-opacity="0.35"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" fill="#0f0415"/>
    <text x="54" y="108" font-family="'Bungee', Impact, 'Arial Black', sans-serif" font-size="42" fill="#f92434">RESEARCH-AUTORESEARCH</text>
  <text x="58" y="108" font-family="'Bungee', Impact, 'Arial Black', sans-serif" font-size="42" fill="#00d1da">RESEARCH-AUTORESEARCH</text>
  <text x="56" y="108" font-family="'Bungee', Impact, 'Arial Black', sans-serif" font-size="42" fill="#f2ecf5">RESEARCH-AUTORESEARCH</text>
  <rect x="56" y="126" width="72" height="6" fill="#f85200"/>
