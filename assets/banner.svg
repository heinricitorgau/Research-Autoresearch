<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Research-Autoresearch: a baseline training run">
  <defs>
    <pattern id="grille" width="8" height="4" patternUnits="userSpaceOnUse">
      <rect y="3" width="8" height="1" fill="#030104" fill-opacity="0.28"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" fill="#0f0415"/>
    <text x="53" y="104" font-family="'Bungee', Impact, 'Arial Black', sans-serif" font-size="43" fill="#f92434">RESEARCH-AUTORESEARCH</text>
  <text x="59" y="104" font-family="'Bungee', Impact, 'Arial Black', sans-serif" font-size="43" fill="#00d1da">RESEARCH-AUTORESEARCH</text>
  <text x="56" y="104" font-family="'Bungee', Impact, 'Arial Black', sans-serif" font-size="43" fill="#f2ecf5">RESEARCH-AUTORESEARCH</text>
  <rect x="56" y="126" width="72" height="6" fill="#f85200"/>
  <text x="56" y="176" font-family="'Chivo', 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#d9d1dd">A learning edition of an autonomous LLM</text>
  <text x="56" y="212" font-family="'Chivo', 'Helvetica Neue', Arial, sans-serif" font-size="26" fill="#d9d1dd">research loop, with a fixed 5-minute budget.</text>
  <text x="56" y="278" font-family="'Chivo', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#d5e51b">Python, fork of karpathy/autoresearch</text>
