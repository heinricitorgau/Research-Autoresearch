  <text x="1204" y="102" text-anchor="end" font-family="'Chivo', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#a79dac">Value</text>
  <rect x="660" y="111" width="550" height="2" fill="#a79dac"/>
