  <text x="56" y="203" font-family="'Chivo', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#d9d1dd">research loop, with a fixed 5-minute budget.</text>
  <text x="56" y="262" font-family="'Chivo', 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="700" fill="#d5e51b">Python, fork of karpathy/autoresearch</text>
