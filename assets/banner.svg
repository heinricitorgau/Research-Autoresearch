  <line x1="660" y1="237.8" x2="1216" y2="237.8" stroke="#a1a9af" stroke-width="1"/>
  <text x="660" y="259.1" font-family="'Newsreader', Georgia, 'Times New Roman', serif" font-size="16" fill="#060e15">num_params_M</text>
