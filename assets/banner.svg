  <rect x="640" y="36" width="596" height="2" fill="#060e15"/>
  <text x="660" y="66" font-family="'Newsreader', Georgia, 'Times New Roman', serif" font-size="15" font-weight="500" fill="#3b434b">Baseline run on Apple Silicon, as printed by train.py</text>
  <text x="660" y="98" text-anchor="start" font-family="'Newsreader', Georgia, 'Times New Roman', serif" font-size="14" font-weight="500" fill="#3b434b">Field</text>
  <text x="1204" y="98" text-anchor="end" font-family="'Newsreader', Georgia, 'Times New Roman', serif" font-size="14" font-weight="500" fill="#3b434b">Value</text>
  <rect x="660" y="107" width="556" height="2" fill="#2b343b"/>
  <text x="660" y="130.3" font-family="'Newsreader', Georgia, 'Times New Roman', serif" font-size="16" fill="#970d63">val_bpb</text>
  <text x="1204" y="130.3" text-anchor="end" font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="15" fill="#970d63">2.007002</text>
  <line x1="660" y1="141.2" x2="1216" y2="141.2" stroke="#a1a9af" stroke-width="1"/>
  <text x="660" y="162.5" font-family="'Newsreader', Georgia, 'Times New Roman', serif" font-size="16" fill="#060e15">training_seconds</text>
  <text x="1204" y="162.5" text-anchor="end" font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="15" fill="#060e15">300.1</text>
  <line x1="660" y1="173.4" x2="1216" y2="173.4" stroke="#a1a9af" stroke-width="1"/>
  <text x="660" y="194.7" font-family="'Newsreader', Georgia, 'Times New Roman', serif" font-size="16" fill="#060e15">total_seconds</text>
  <text x="1204" y="194.7" text-anchor="end" font-family="'IBM Plex Mono', Consolas, 'Courier New', monospace" font-size="15" fill="#060e15">783.5</text>
  <line x1="660" y1="205.6" x2="1216" y2="205.6" stroke="#a1a9af" stroke-width="1"/>
  <text x="660" y="226.9" font-family="'Newsreader', Georgia, 'Times New Roman', serif" font-size="16" fill="#060e15">num_steps</text>
