<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-label="Research-Autoresearch: a baseline training run">
  <rect width="1280" height="320" fill="#c4cbd2"/>
  <rect x="0.5" y="0.5" width="1279" height="319" fill="none" stroke="#a1a9af"/>
    <text x="56" y="104" font-family="'Hanken Grotesk', 'Helvetica Neue', Arial, sans-serif" font-size="41" font-weight="600" letter-spacing="-1" fill="#060e15">Research-Autoresearch</text>
  <rect x="56" y="122" width="504" height="2" fill="#2b343b"/>
  <text x="56" y="166" font-family="'Newsreader', Georgia, 'Times New Roman', serif" font-size="23" fill="#182027">A learning edition of an autonomous LLM</text>
  <text x="56" y="198" font-family="'Newsreader', Georgia, 'Times New Roman', serif" font-size="23" fill="#182027">research loop, with a fixed 5-minute budget.</text>
  <text x="56" y="260" font-family="'Newsreader', Georgia, 'Times New Roman', serif" font-size="17" font-weight="500" fill="#3b434b">Python, fork of karpathy/autoresearch</text>
