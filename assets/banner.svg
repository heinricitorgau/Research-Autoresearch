  <text x="1204" y="127.7" text-anchor="end" font-family="'Chivo', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="900" fill="#0f0415">2.007002</text>
  <text x="660" y="159.1" font-family="'Chivo', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#f2ecf5">training_seconds</text>
